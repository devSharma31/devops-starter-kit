# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI/CD

on:
  push:
    branches: [ "main", "feat/container-apps" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: ghcr.io/devsharma31/devops-starter-kit
  RESOURCE_GROUP: rg-devops-starter-kit
  CONTAINER_APP: devops-starter-app-dev31

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check . --fix

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

  image:
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC login to Azure, no stored credentials
    outputs:
      fqdn: ${{ steps.rollout.outputs.fqdn }}
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Roll out new image
        id: rollout
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update \
            -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
            --image "$IMAGE_NAME:${{ github.sha }}" -o none
          FQDN=$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"
          echo "Deployed to https://$FQDN"

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://${{ needs.deploy.outputs.fqdn }}
    steps:
      - name: Health check (allows for scale-from-zero cold start)
        run: |
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$BASE_URL/health" || true)
            echo "Attempt $i: /health returned $STATUS"
            [ "$STATUS" = "200" ] && echo "PASSED — app is live and healthy" && exit 0
            sleep 10
          done
          echo "FAILED — /health never returned 200"; exit 1

      - name: AI summarise smoke test
        run: |
          RESPONSE=$(curl -s --max-time 60 -X POST "$BASE_URL/summarize" \
            -H "Content-Type: application/json" \
            -d '{"text": "DevOps combines software development and IT operations to accelerate delivery and improve reliability through automation and continuous integration."}')
          echo "Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"summary"'; then
            echo "PASSED — Azure OpenAI GPT-4o responded on the live Container App"
          else
            echo "FAILED — summary field missing from response"; exit 1
          fi
